<head>

    <meta name="twitter:card" content="summary_large_image">

    <meta name="twitter:description" content="Find a job in 2026, built on real Toronto job data.">
    <meta name="twitter:image" content="https://getjob.pages.dev/og-image.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #FFFFFF;
            min-height: 100vh;
            height: 100dvh;
            padding: clamp(10px, 2vh, 22px) 0 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
        }

        .hero-title {
            position: relative;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 0.18em 0.24em;
            max-width: none;
            font-family: 'Bricolage Grotesque', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: clamp(2.2rem, min(6.2vw, 7.6vh), 4.4rem);
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 0.96;
            color: #111827;
            text-align: center;
            margin-top: auto;
            margin-bottom: clamp(10px, 2vh, 22px);
        }

        .hero-title {
            position: relative;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 0.18em 0.24em;
            max-width: none;
            font-family: 'Bricolage Grotesque', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: clamp(2.15rem, 6vw, 4.1rem);
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 0.96;
            color: #111827;
            text-align: center;
            margin-bottom: 14px;
        }

        .hero-word {
            display: inline-block;
            text-shadow: 0 4px 0 #FFA8B6;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .hero-word--find {
            transform: rotate(-2.5deg);
        }

        .hero-word--find:hover {
            transform: rotate(2deg) scale(1.06);
        }

        .hero-word--job {
            color: #FF2A54;
            -webkit-text-stroke: 2px #82222B;
            paint-order: stroke fill;
            text-shadow: 0 5px 0 #8F2831;
            transform: rotate(1.8deg);
        }

        .hero-word--job:hover {
            transform: rotate(-2deg) scale(1.06);
        }

        .hero-word--in {
            font-size: 0.56em;
            font-style: italic;
            color: #6B7280;
            text-shadow: none;
            transform: rotate(-6deg) translateY(0.06em);
        }

        .hero-year {
            display: inline-block;
            padding: 0.04em 0.26em 0.08em;
            font-size: 0.88em;
            letter-spacing: -0.02em;
            color: #FFFFFF;
            background: linear-gradient(180deg, #FF4D6D 0%, #FF2A54 100%);
            border: 2.5px solid #82222B;
            border-radius: 18px;
            box-shadow: 0 6px 0 #8F2831, 0 12px 24px rgba(255, 42, 84, 0.24);
            transform: rotate(-3.5deg);
            animation: badge-bob 3.4s ease-in-out infinite;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
        }

        .hero-year:hover {
            transform: rotate(2deg) translateY(2px);
            box-shadow: 0 3px 0 #8F2831, 0 6px 14px rgba(255, 42, 84, 0.24);
        }

        .hero-sparkle {
            position: absolute;
            pointer-events: none;
            color: #FF4D6D;
            animation: sparkle-spin 5.5s ease-in-out infinite;
        }

        .hero-sparkle--left {
            width: clamp(22px, 4vw, 32px);
            height: clamp(22px, 4vw, 32px);
            top: -12px;
            left: -18px;
        }

        .hero-sparkle--right {
            width: clamp(18px, 3.2vw, 26px);
            height: clamp(18px, 3.2vw, 26px);
            bottom: -6px;
            right: -14px;
            color: #FFA8B6;
            animation-delay: -2.4s;
        }

        @keyframes badge-bob {
            0%, 100% {
                transform: rotate(-3.5deg) translateY(0);
            }
            50% {
                transform: rotate(-1.5deg) translateY(-4px);
            }
        }

        @keyframes sparkle-spin {
            0%, 100% {
                transform: scale(0.92) rotate(0deg);
            }
            50% {
                transform: scale(1.15) rotate(24deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .hero-year,
            .hero-sparkle,
            .steam-line,
            .data-bubble {
                animation: none;
            }
        }

        /* 3D Perspective Monitor + Desk Scene */
        .scene {
            position: relative;
            width: min(100vw, calc(136dvh - 235px), 1140px);
            min-width: 310px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .monitor-rig {
            position: relative;
            z-index: 3;
            width: 60%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Side Text Bubble: Based on Real Toronto Job Data */
        .data-bubble {
            position: absolute;
            left: calc(100% + clamp(12px, 1.8vw, 22px));
            top: 40%;
            z-index: 6;
            width: clamp(134px, 16vw, 174px);
            padding: 11px 13px;
            background: #FFFFFF;
            border: 2.5px solid #1F2937;
            border-radius: 16px;
            box-shadow: 0 5px 0 #E2E8F0, 0 7.5px 0 #1F2937, 0 12px 22px rgba(17, 24, 39, 0.1);
            color: #111827;
            font-family: 'Bricolage Grotesque', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: clamp(12px, 1.15vw, 14px);
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: -0.01em;
            text-align: left;
            transform: translateY(-50%) rotate(2.2deg);
            animation: bubble-float 4.2s ease-in-out infinite;
        }

        .data-bubble::before {
            content: "";
            position: absolute;
            left: -13px;
            top: 50%;
            transform: translateY(-50%);
            border-top: 9px solid transparent;
            border-bottom: 9px solid transparent;
            border-right: 12px solid #1F2937;
        }

        .data-bubble::after {
            content: "";
            position: absolute;
            left: -9px;
            top: 50%;
            transform: translateY(-50%);
            border-top: 7px solid transparent;
            border-bottom: 7px solid transparent;
            border-right: 10px solid #FFFFFF;
        }

        .data-bubble-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            margin-right: 5px;
            border-radius: 50%;
            background: #FF2A54;
            vertical-align: 1px;
            box-shadow: 0 0 0 3px #FFE4E6;
        }

        @keyframes bubble-float {
            0%, 100% {
                transform: translateY(-50%) rotate(2.2deg);
            }
            50% {
                transform: translateY(calc(-50% - 4px)) rotate(1.2deg);
            }
        }

        @media (max-width: 760px) {
            .data-bubble {
                position: relative;
                left: auto;
                top: auto;
                width: auto;
                max-width: 260px;
                margin-bottom: 14px;
                padding: 7px 13px;
                text-align: center;
                transform: rotate(-1.2deg);
                animation: none;
            }

            .data-bubble::before {
                left: 50%;
                top: 100%;
                transform: translateX(-50%);
                border-right: 8px solid transparent;
                border-left: 8px solid transparent;
                border-top: 10px solid #1F2937;
                border-bottom: none;
            }

            .data-bubble::after {
                left: 50%;
                top: calc(100% - 3px);
                transform: translateX(-50%);
                border-right: 6px solid transparent;
                border-left: 6px solid transparent;
                border-top: 8px solid #FFFFFF;
                border-bottom: none;
            }
        }

        .monitor-frame {
            position: relative;
            width: 100%;
            background: linear-gradient(180deg, #FAFBFD 0%, #E9EEF5 100%);
            border: 2.5px solid #1F2937;
            border-radius: 22px;
            padding: 15px 13px 10px;
            box-shadow:
                inset 0 2px 0 rgba(255, 255, 255, 0.9),
                0 8px 0 #CBD5E1,
                0 10.5px 0 #1F2937,
                0 18px 30px rgba(17, 24, 39, 0.12);
        }

        .monitor-webcam {
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #64748B 0%, #0F172A 75%);
            border: 1px solid #334155;
        }

        .monitor-sticky {
            position: absolute;
            top: -10px;
            right: -12px;
            z-index: 5;
            padding: 5px 8px 6px;
            background: linear-gradient(180deg, #FEF08A 0%, #FDE047 100%);
            border: 2px solid #854D0E;
            border-radius: 3px 3px 10px 3px;
            color: #713F12;
            font-size: 9.5px;
            font-weight: 800;
            letter-spacing: 0.03em;
            line-height: 1.05;
            text-align: center;
            transform: rotate(7deg);
            box-shadow: 0 3px 0 rgba(133, 77, 14, 0.25), 0 6px 12px rgba(17, 24, 39, 0.12);
            pointer-events: none;
        }

        .monitor-screen {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 10.2;
            background: radial-gradient(circle at 50% 42%, #24293E 0%, #151828 100%);
            border: 2px solid #111827;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: inset 0 3px 12px rgba(0, 0, 0, 0.45);
        }

        .monitor-screen::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(125deg, rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0) 38%);
            pointer-events: none;
        }

        .monitor-screen.is-shaking {
            animation: screen-shake 0.34s cubic-bezier(0.36, 0.07, 0.19, 0.97);
        }

        @keyframes screen-shake {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(-3px, 1.5px); }
            40% { transform: translate(3px, -1.5px); }
            60% { transform: translate(-2px, 1px); }
            80% { transform: translate(2px, -0.5px); }
        }

        #wheel-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .result-popup {
            position: absolute;
            left: 50%;
            top: 50%;
            z-index: 4;
            width: min(88%, 312px);
            padding: 12px 15px 13px;
            border-radius: 14px;
            background: rgba(15, 23, 42, 0.94);
            border: 2px solid rgba(255, 255, 255, 0.24);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.06) inset;
            backdrop-filter: blur(8px);
            text-align: center;
            pointer-events: none;
            opacity: 0;
            transform: translate(-50%, -44%) scale(0.82);
            transition: opacity 0.24s ease, transform 0.34s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .result-popup.is-visible {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .result-popup.is-win {
            background: linear-gradient(180deg, rgba(255, 42, 84, 0.96) 0%, rgba(159, 18, 57, 0.96) 100%);
            border-color: #FEF08A;
            box-shadow: 0 12px 30px rgba(255, 42, 84, 0.52), 0 0 18px rgba(254, 240, 138, 0.35);
        }

        .result-popup-title {
            color: #FFFFFF;
            font-family: 'Bricolage Grotesque', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 16.5px;
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.12;
            margin-bottom: 5px;
        }

        .result-popup-quip {
            color: #E2E8F0;
            font-size: 12px;
            font-weight: 600;
            line-height: 1.38;
        }

        .result-popup.is-win .result-popup-quip {
            color: #FFF1F2;
        }

        .monitor-hud {
            position: absolute;
            top: 7px;
            left: 9px;
            right: 9px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            pointer-events: none;
            z-index: 2;
        }

        .hud-pill {
            padding: 3px 8px;
            border-radius: 999px;
            background: rgba(15, 23, 42, 0.76);
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: #E2E8F0;
            font-size: 9.5px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        .hud-pill strong {
            color: #FDA4AF;
        }

        .wheel-status {
            position: absolute;
            left: 50%;
            bottom: 7px;
            transform: translateX(-50%);
            padding: 3.5px 11px;
            border-radius: 999px;
            background: rgba(17, 24, 39, 0.82);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #F9FAFB;
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            white-space: nowrap;
            backdrop-filter: blur(4px);
            pointer-events: none;
            transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }

        .wheel-status.is-win {
            background: rgba(255, 42, 84, 0.92);
            border-color: #FFA8B6;
            color: #FFFFFF;
        }

        .monitor-chin {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 7px 8px 0;
        }

        .monitor-brand {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.14em;
            color: #94A3B8;
            text-transform: uppercase;
        }

        .monitor-led {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10B981;
            border: 1.5px solid #065F46;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.65);
            transition: background-color 0.2s ease, box-shadow 0.2s ease;
        }

        .monitor-led.is-spinning {
            background: #FF4D6D;
            border-color: #82222B;
            box-shadow: 0 0 10px rgba(255, 77, 109, 0.85);
        }

        .monitor-neck {
            width: 58px;
            height: 28px;
            background: linear-gradient(90deg, #B8C4D4 0%, #E2E8F0 45%, #CBD5E1 100%);
            border-left: 2.5px solid #1F2937;
            border-right: 2.5px solid #1F2937;
            clip-path: polygon(8% 0%, 92% 0%, 100% 100%, 0% 100%);
        }

        .monitor-base {
            position: relative;
            width: 162px;
            height: 18px;
            background: linear-gradient(180deg, #F8FAFC 0%, #CBD5E1 100%);
            border: 2.5px solid #1F2937;
            border-radius: 50%;
            box-shadow:
                0 4px 0 #94A3B8,
                0 6px 0 #1F2937,
                0 10px 14px rgba(105, 72, 46, 0.28);
        }

        .desk-stage {
            position: relative;
            z-index: 2;
            width: 100%;
            margin-top: -6.5%;
        }

        .desk-illustration {
            display: block;
            width: 100%;
            height: auto;
            overflow: visible;
            pointer-events: none;
        }

        .steam-line {
            animation: steam-rise 3.2s ease-in-out infinite;
            transform-origin: center bottom;
        }

        .steam-line--2 {
            animation-delay: -1.1s;
        }

        .steam-line--3 {
            animation-delay: -2.1s;
        }

        @keyframes steam-rise {
            0%, 100% {
                opacity: 0.25;
                transform: translateY(3px) scaleY(0.92);
            }
            50% {
                opacity: 0.72;
                transform: translateY(-4px) scaleY(1.06);
            }
        }

        .buzzer-wrapper {
            position: absolute;
            z-index: 4;
            left: 50%;
            top: 57.4%;
            transform: translate(-50%, -50%);
            width: 41.3%;
            min-width: 150px;
            aspect-ratio: 4 / 3;
        }

        #coral-puck-canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: manipulation;
            outline: none;
        }
        /* ---------- Job-offer state: buzzer retired ---------- */
        .buzzer-wrapper.is-hired {
            filter: grayscale(1) opacity(0.5);
        }

        .buzzer-wrapper.is-hired #coral-puck-canvas {
            cursor: not-allowed !important;
        }

        /* ---------- Share buttons ---------- */
        .share-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            min-height: 48px;
            padding: 10px 14px;
            border: 2px solid #1F2937;
            border-radius: 14px;
            background: #FFFFFF;
            color: #111827;
            font-family: 'Bricolage Grotesque', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: -0.01em;
            line-height: 1;
            cursor: pointer;
            box-shadow: 0 4px 0 #1F2937;
            transition: transform 0.12s ease, box-shadow 0.12s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .share-btn:hover {
            transform: translateY(-1px);
        }

        .share-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #1F2937;
        }

        .share-btn:focus-visible {
            outline: 3px solid #FDA4AF;
            outline-offset: 3px;
        }

        .share-btn--primary {
            background: #FF2A54;
            color: #FFFFFF;
            border-color: #82222B;
            box-shadow: 0 4px 0 #8F2831;
        }

        .share-btn--primary:active {
            box-shadow: 0 1px 0 #8F2831;
        }

        .share-btn--whatsapp {
            background: #25D366;
            color: #FFFFFF;
        }

        .share-btn--linkedin {
            background: #0A66C2;
            color: #FFFFFF;
        }

        .share-btn--x {
            background: #111827;
            color: #FFFFFF;
            box-shadow: 0 4px 0 #030712;
        }

        .share-btn--copy {
            background: #F1F5F9;
        }

        /* ---------- Persistent "share my win" bar after hire ---------- */
        .hired-share {
            position: fixed;
            left: 50%;
            bottom: max(16px, env(safe-area-inset-bottom));
            z-index: 900;
            width: min(calc(100% - 32px), 320px);
            transform: translateX(-50%);
            animation: hired-pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .hired-share[hidden],
        .celebrate[hidden] {
            display: none;
        }

        @keyframes hired-pop {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(30px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateX(-50%);
            }
        }

        /* ---------- Job-offer celebration overlay ---------- */
        .celebrate {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(15, 23, 42, 0.72);
            -webkit-backdrop-filter: blur(4px);
            backdrop-filter: blur(4px);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .celebrate.is-open {
            opacity: 1;
        }

        .celebrate-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .celebrate-card {
            position: relative;
            width: min(100%, 380px);
            max-height: calc(100vh - 40px);
            max-height: calc(100dvh - 40px);
            overflow-y: auto;
            padding: 26px 20px 18px;
            border: 2.5px solid #1F2937;
            border-radius: 26px;
            background: #FFFFFF;
            box-shadow: 0 8px 0 #1F2937, 0 24px 60px rgba(0, 0, 0, 0.35);
            text-align: center;
            transform: translateY(24px) scale(0.85) rotate(-2deg);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .celebrate.is-open .celebrate-card {
            transform: translateY(0) scale(1) rotate(-1deg);
        }

        .celebrate-kicker {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 999px;
            background: #FFE4E6;
            color: #9F1239;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .celebrate-title {
            margin: 14px 0 10px;
            color: #111827;
            font-family: 'Bricolage Grotesque', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: clamp(2.2rem, 10vw, 2.9rem);
            font-weight: 800;
            letter-spacing: -0.035em;
            line-height: 1;
        }

        .celebrate-title span {
            display: inline-block;
            color: #FF2A54;
            text-shadow: 0 3px 0 #FFA8B6;
            animation: celebrate-wiggle 1.6s ease-in-out infinite;
        }

        @keyframes celebrate-wiggle {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg) scale(1.05); }
        }

        .celebrate-sub {

    <script>
        /**
         * ====================================================================
         * HEAVY SPRING EDITION + MONITOR WHEEL
         * Self-contained 2.5D HTML5 Canvas button with damped spring physics,
         * interactive monitor wheel, and dual-stage Web Audio feedback.
         * ====================================================================
         */
        (() => {
            const canvas = document.getElementById('coral-puck-canvas');
            const ctx = canvas.getContext('2d');
            const wheelCanvas = document.getElementById('wheel-canvas');
            const wheelCtx = wheelCanvas.getContext('2d');
            const wheelStatusEl = document.getElementById('wheel-status');
            const monitorLedEl = document.getElementById('monitor-led');
            const appsCounterEl = document.getElementById('apps-counter');
            const monitorScreenEl = document.getElementById('monitor-screen');
            const resultPopupEl = document.getElementById('result-popup');
            const resultPopupTitleEl = document.getElementById('result-popup-title');
            const resultPopupQuipEl = document.getElementById('result-popup-quip');

            // 1. Visual Palette & Heavy Spring Physics
            const CONFIG = {
                baseTopLight: '#FAFBFD',
                baseTopDark: '#DCE4EE',
                baseWallLight: '#CBD5E1',
                baseWallDark: '#94A3B8',
                baseStroke: '#1F2937',
                wellTop: '#0F172A',
                wellBottom: '#334155',
                wallColor: '#8F2831',
                wallDark: '#781F27',
                topCenter: '#FF4D6D',
                topEdge: '#FF2A54',
                rimStroke: '#82222B',
                // Heavy spring preset
                stiffness: 220,
                damping: 28
            };

            // 2A. Pre-Initialized Web Audio Synthesizer (Zero First-Press Lag)
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            let audioCtx = null;
            try {
                if (AudioCtx) audioCtx = new AudioCtx();
            } catch (e) {}

            function unlockAudio() {
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume().catch(() => {});
                }
            }
            window.addEventListener('pointerdown', unlockAudio, { once: true, passive: true });
            window.addEventListener('keydown', unlockAudio, { once: true, passive: true });

            function runWithAudio(fn) {
                try {
                    if (!audioCtx && AudioCtx) audioCtx = new AudioCtx();
                    if (!audioCtx) return;
                    if (audioCtx.state === 'suspended') {
                        audioCtx.resume().then(() => fn(audioCtx)).catch(() => {});
                    } else {
                        fn(audioCtx);
                    }
                } catch (e) {}
            }

            function playPressSound() {
                runWithAudio((ac) => {
                    const now = ac.currentTime;
                    const osc = ac.createOscillator();
                    const body = ac.createOscillator();
                    const gain = ac.createGain();
                    const bodyGain = ac.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(360, now);
                    osc.frequency.exponentialRampToValueAtTime(540, now + 0.035);
                    osc.frequency.exponentialRampToValueAtTime(420, now + 0.14);

                    gain.gain.setValueAtTime(0.001, now);
                    gain.gain.linearRampToValueAtTime(0.18, now + 0.008);
                    gain.gain.exponentialRampToValueAtTime(0.0008, now + 0.16);

                    body.type = 'triangle';
                    body.frequency.setValueAtTime(175, now);
                    body.frequency.exponentialRampToValueAtTime(95, now + 0.045);

                    bodyGain.gain.setValueAtTime(0.14, now);
                    bodyGain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

                    osc.connect(gain);
                    body.connect(bodyGain);
                    gain.connect(ac.destination);
                    bodyGain.connect(ac.destination);

                    osc.start(now);
                    body.start(now);
                    osc.stop(now + 0.18);
                    body.stop(now + 0.06);
                });
            }

            function playReleaseSound() {
                runWithAudio((ac) => {
                    const now = ac.currentTime;
                    const osc = ac.createOscillator();
                    const gain = ac.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(204, now);
                    osc.frequency.exponentialRampToValueAtTime(300, now + 0.035);

                    gain.gain.setValueAtTime(0.0001, now);
                    gain.gain.linearRampToValueAtTime(0.045, now + 0.005);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.055);

                    osc.connect(gain);
                    gain.connect(ac.destination);
                    osc.start(now);
                    osc.stop(now + 0.06);
                });
            }

            function playWheelTick() {
                runWithAudio((ac) => {
                    const now = ac.currentTime;
                    const osc = ac.createOscillator();
                    const gain = ac.createGain();

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(980, now);
                    osc.frequency.exponentialRampToValueAtTime(420, now + 0.018);

                    gain.gain.setValueAtTime(0.0001, now);
                    gain.gain.linearRampToValueAtTime(0.042, now + 0.002);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.022);

                    osc.connect(gain);
                    gain.connect(ac.destination);
                    osc.start(now);
                    osc.stop(now + 0.025);
                });
            }

            function playResultChime(isWin) {
                runWithAudio((ac) => {
                    const now = ac.currentTime;
                    const notes = isWin ? [523.25, 659.25, 783.99, 1046.5] : [311.13, 277.18];
                    notes.forEach((freq, idx) => {
                        const osc = ac.createOscillator();
                        const gain = ac.createGain();
                        const t = now + idx * (isWin ? 0.075 : 0.12);

                        osc.type = isWin ? 'sine' : 'triangle';
                        osc.frequency.setValueAtTime(freq, t);

                        gain.gain.setValueAtTime(0.0001, t);
                        gain.gain.linearRampToValueAtTime(isWin ? 0.12 : 0.08, t + 0.012);

            const TWO_PI = Math.PI * 2;

            // Assign equal visual angular spans to every slice

                seg.start = i * SLICE_ANGLE;

            const TOTAL_WEIGHT = WHEEL_SEGMENTS.reduce((sum, s) => sum + s.pct, 0);

                width: 0,

            function pickWeightedSegment() {
                let r = Math.random() * TOTAL_WEIGHT;
                for (let i = 0; i < WHEEL_SEGMENTS.length; i++) {
                    r -= WHEEL_SEGMENTS[i].pct;
                    if (r <= 0) return WHEEL_SEGMENTS[i];
                }
                return WHEEL_SEGMENTS[1];
            }

                if (!seg.quipQueue || seg.quipQueue.length === 0) {
                    seg.quipQueue = seg.quips.slice();
                    for (let i = seg.quipQueue.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        const tmp = seg.quipQueue[i];
                        seg.quipQueue[i] = seg.quipQueue[j];
                        seg.quipQueue[j] = tmp;
                    }
                    if (seg.quipQueue.length > 1 && seg.quipQueue[seg.quipQueue.length - 1] === seg.lastQuip) {
                        const swapIdx = Math.floor(Math.random() * (seg.quipQueue.length - 1));
                        const lastIdx = seg.quipQueue.length - 1;
                        const tmp = seg.quipQueue[lastIdx];
                        seg.quipQueue[lastIdx] = seg.quipQueue[swapIdx];
                        seg.quipQueue[swapIdx] = tmp;
                    }
                }
                const next = seg.quipQueue.pop();
                seg.lastQuip = next;
                return next;
            }

            function spinWheel() {
                wheel.apps += 1;
                appsCounterEl.innerHTML = `Apps: <strong>${wheel.apps}</strong>`;

                const seg = pickWeightedSegment();
                wheel.winningSeg = seg;
                wheel.isSpinning = true;
                wheel.elapsed = 0;
                wheel.duration = 3.2 + Math.random() * 0.85;
                wheel.highlightTimer = 0;
                wheel.particles = [];

                // Pick a landing offset safely inside the chosen equal slice (avoiding peg borders)
                const margin = SLICE_ANGLE * 0.16;
                const landingInSlice = seg.start + margin + Math.random() * (SLICE_ANGLE - margin * 2);

                // Pointer is at -PI/2; we want (targetAngle + landingInSlice) % TWO_PI === -PI/2
                const pointerAngle = -Math.PI / 2;
                const currentMod = ((wheel.angle % TWO_PI) + TWO_PI) % TWO_PI;
                const desiredMod = (((pointerAngle - landingInSlice) % TWO_PI) + TWO_PI) % TWO_PI;
                let delta = desiredMod - currentMod;
                if (delta < 0) delta += TWO_PI;

                const fullTurns = (5 + Math.floor(Math.random() * 3)) * TWO_PI;
                wheel.startAngle = wheel.angle;
                wheel.targetAngle = wheel.angle + fullTurns + delta;
                wheel.lastPegIdx = Math.floor(wheel.angle / PEG_STEP);

                hideResultPopup();
                monitorLedEl.classList.add('is-spinning');
                wheelStatusEl.classList.remove('is-win');
                wheelStatusEl.textContent = 'Applying to Toronto Jobs…';
            }

            function resizeWheel() {
                const rect = wheelCanvas.getBoundingClientRect();
                const dpr = Math.min(window.devicePixelRatio || 1, 3);
                wheel.width = rect.width;
                wheel.height = rect.height;
                wheelCanvas.width = Math.round(rect.width * dpr);
                wheelCanvas.height = Math.round(rect.height * dpr);
                wheelCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }

            function updateWheel(dt) {
                wheel.marqueePhase += dt * (wheel.isSpinning ? 8.5 : 2.2);

                if (wheel.isSpinning) {
                    wheel.elapsed += dt;
                    const t = Math.min(1, wheel.elapsed / wheel.duration);
                    // Quintic ease-out for satisfying wheel-of-fortune suspense
                    const eased = 1 - Math.pow(1 - t, 4.4);
                    wheel.angle = wheel.startAngle + (wheel.targetAngle - wheel.startAngle) * eased;

                    const pegIdx = Math.floor(wheel.angle / PEG_STEP);
                    if (pegIdx !== wheel.lastPegIdx) {
                        wheel.lastPegIdx = pegIdx;
                        wheel.flapperAngle = -0.44;
                        wheel.flapperVel = 0;
                        playWheelTick();
                    }

                    if (t >= 1) {
                        wheel.isSpinning = false;
                        wheel.angle = wheel.targetAngle;
                        wheel.highlightTimer = 2.6;
                        monitorLedEl.classList.remove('is-spinning');

                        const seg = wheel.winningSeg;
                        wheelStatusEl.textContent = seg.isWin ? '★ 0.7% Miracle Unlocked! ★' : `${seg.label} (${seg.pct}%)`;
                        wheelStatusEl.classList.toggle('is-win', seg.isWin);

                        playResultChime(seg.isWin);
                        spawnOutcomeParticles(seg);
                        showResultPopup(seg);
                        if (seg.isWin) onWin();

                        if (seg.fx === 'reject') {
                            triggerScreenShake();
                        }
                    }
                } else if (wheel.highlightTimer > 0) {
                    wheel.highlightTimer = Math.max(0, wheel.highlightTimer - dt);
                }

                // Spring return for top pointer flapper
                const fForce = -240 * wheel.flapperAngle - 18 * wheel.flapperVel;
                wheel.flapperVel += fForce * dt;
                wheel.flapperAngle += wheel.flapperVel * dt;

                // Update outcome particles
                for (let i = wheel.particles.length - 1; i >= 0; i--) {
                    const p = wheel.particles[i];
                    p.life -= dt;
                    if (p.life <= 0) {
                        wheel.particles.splice(i, 1);
                        continue;
                    }
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    if (p.type === 'confetti') {
                        p.vy += 190 * dt;
                        p.vx *= 0.985;
                        p.rot += p.vrot * dt;
                    } else if (p.type === 'x') {
                        p.rot += p.vrot * dt;
                    } else if (p.type === 'ghost') {
                        p.phase += dt * 4.5;
                        p.x += Math.sin(p.phase) * 18 * dt;
                    }
                }
            }

            function drawWheel() {
                const w = wheel.width;
                const h = wheel.height;
                if (!w || !h) return;

                wheelCtx.clearRect(0, 0, w, h);

                const cx = w * 0.5;
                const cy = h * 0.485;
                const radius = Math.min(w * 0.36, h * 0.405);
                const bezelRadius = radius + Math.max(8, radius * 0.11);

                // Subtle ambient glow behind the wheel
                const backGlow = wheelCtx.createRadialGradient(cx, cy, radius * 0.3, cx, cy, bezelRadius * 1.4);
                backGlow.addColorStop(0, 'rgba(255, 77, 109, 0.16)');
                backGlow.addColorStop(1, 'rgba(255, 77, 109, 0)');
                wheelCtx.fillStyle = backGlow;
                wheelCtx.beginPath();
                wheelCtx.arc(cx, cy, bezelRadius * 1.4, 0, TWO_PI);
                wheelCtx.fill();

                // Metallic outer bezel ring
                const bezelGrad = wheelCtx.createLinearGradient(cx - bezelRadius, cy - bezelRadius, cx + bezelRadius, cy + bezelRadius);
                bezelGrad.addColorStop(0, '#475569');
                bezelGrad.addColorStop(0.5, '#1E293B');
                bezelGrad.addColorStop(1, '#0F172A');

                wheelCtx.save();
                wheelCtx.shadowColor = 'rgba(0, 0, 0, 0.45)';
                wheelCtx.shadowBlur = 16;
                wheelCtx.shadowOffsetY = 5;
                wheelCtx.beginPath();
                wheelCtx.arc(cx, cy, bezelRadius, 0, TWO_PI);
                wheelCtx.fillStyle = bezelGrad;
                wheelCtx.fill();
                wheelCtx.lineWidth = 1.6;
                wheelCtx.strokeStyle = 'rgba(255, 255, 255, 0.22)';
                wheelCtx.stroke();
                wheelCtx.restore();

                // Rotating Wheel Body
                wheelCtx.save();
                wheelCtx.translate(cx, cy);
                wheelCtx.rotate(wheel.angle);

                for (let i = 0; i < WHEEL_SEGMENTS.length; i++) {
                    const seg = WHEEL_SEGMENTS[i];
                    const mid = (seg.start + seg.end) * 0.5;

                    // Wedge gradient
                    const sliceGrad = wheelCtx.createRadialGradient(0, 0, radius * 0.14, 0, 0, radius);
                    sliceGrad.addColorStop(0, seg.colorA);
                    sliceGrad.addColorStop(1, seg.colorB);

                    wheelCtx.beginPath();
                    wheelCtx.moveTo(0, 0);
                    wheelCtx.arc(0, 0, radius, seg.start, seg.end);
                    wheelCtx.closePath();
                    wheelCtx.fillStyle = sliceGrad;
                    wheelCtx.fill();

                    // Pulsing highlight on winning slice
                    if (!wheel.isSpinning && wheel.winningSeg === seg && wheel.highlightTimer > 0) {
                        const pulse = 0.22 + 0.18 * Math.sin(wheel.highlightTimer * 14);
                        wheelCtx.fillStyle = `rgba(255, 255, 255, ${pulse.toFixed(3)})`;
                        wheelCtx.fill();
                    }

                    // Crisp divider lines
                    wheelCtx.lineWidth = 1.4;
                    wheelCtx.strokeStyle = 'rgba(15, 23, 42, 0.45)';
                    wheelCtx.stroke();

                    // Radial label + percentage (calibrated sizing & maxWidth clamping)
                    wheelCtx.save();
                    wheelCtx.rotate(mid);
                    wheelCtx.textAlign = 'right';
                    wheelCtx.textBaseline = 'middle';

                    const labelSize = Math.max(8.5, Math.min(11.5, radius * 0.135));
                    const pctSize = Math.max(7.5, Math.min(10, radius * 0.115));
                    const textX = radius * 0.88;
                    const maxLabelWidth = radius * 0.54;

                    wheelCtx.fillStyle = seg.text;
                    wheelCtx.font = `800 ${labelSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
                    wheelCtx.fillText(seg.shortLabel, textX, -pctSize * 0.58, maxLabelWidth);

                    wheelCtx.globalAlpha = 0.88;
                    wheelCtx.font = `700 ${pctSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
                    wheelCtx.fillText(`${seg.pct}%`, textX, pctSize * 0.62, maxLabelWidth);
                    wheelCtx.restore();
                }

                // Subtle inner rim vignette for 3D depth
                const rimShadow = wheelCtx.createRadialGradient(0, 0, radius * 0.72, 0, 0, radius);
                rimShadow.addColorStop(0, 'rgba(0, 0, 0, 0)');
                rimShadow.addColorStop(1, 'rgba(15, 23, 42, 0.26)');
                wheelCtx.fillStyle = rimShadow;
                wheelCtx.beginPath();
                wheelCtx.arc(0, 0, radius, 0, TWO_PI);
                wheelCtx.fill();

                // 18 Metallic Rim Pegs
                for (let p = 0; p < PEG_COUNT; p++) {
                    const a = p * PEG_STEP;
                    const px = Math.cos(a) * (radius + (bezelRadius - radius) * 0.45);
                    const py = Math.sin(a) * (radius + (bezelRadius - radius) * 0.45);
                    const isLit = Math.floor(wheel.marqueePhase + p) % 2 === 0;

                    wheelCtx.beginPath();
                    wheelCtx.arc(px, py, Math.max(1.8, radius * 0.028), 0, TWO_PI);
                    wheelCtx.fillStyle = isLit ? '#FEF08A' : '#64748B';
                    wheelCtx.fill();
                }

                wheelCtx.restore(); // End rotating wheel

                // 3D Metallic Center Hub
                const hubR = Math.max(11, radius * 0.18);
                const hubGrad = wheelCtx.createRadialGradient(cx - hubR * 0.3, cy - hubR * 0.3, 1, cx, cy, hubR);
                hubGrad.addColorStop(0, '#FFFFFF');
                hubGrad.addColorStop(0.55, '#CBD5E1');
                hubGrad.addColorStop(1, '#64748B');

                wheelCtx.save();
                wheelCtx.shadowColor = 'rgba(0, 0, 0, 0.38)';
                wheelCtx.shadowBlur = 8;
                wheelCtx.shadowOffsetY = 2;
                wheelCtx.beginPath();
                wheelCtx.arc(cx, cy, hubR, 0, TWO_PI);
                wheelCtx.fillStyle = hubGrad;
                wheelCtx.fill();
                wheelCtx.lineWidth = 1.6;
                wheelCtx.strokeStyle = '#0F172A';
                wheelCtx.stroke();

                // Center coral dot
                wheelCtx.beginPath();
                wheelCtx.arc(cx, cy, hubR * 0.42, 0, TWO_PI);
                wheelCtx.fillStyle = '#FF2A54';
                wheelCtx.fill();
                wheelCtx.restore();

                // Top Pivoted Pointer Flapper
                wheelCtx.save();
                wheelCtx.translate(cx, cy - bezelRadius - 1);
                wheelCtx.rotate(wheel.flapperAngle);
                const ptrH = Math.max(15, radius * 0.24);
                const ptrW = Math.max(10, radius * 0.15);

                wheelCtx.shadowColor = 'rgba(0, 0, 0, 0.45)';
                wheelCtx.shadowBlur = 5;
                wheelCtx.shadowOffsetY = 2;

                wheelCtx.beginPath();
                wheelCtx.moveTo(0, ptrH);
                wheelCtx.lineTo(-ptrW * 0.55, -2);
                wheelCtx.lineTo(ptrW * 0.55, -2);
                wheelCtx.closePath();
                wheelCtx.fillStyle = '#FF2A54';
                wheelCtx.fill();
                wheelCtx.lineWidth = 1.6;
                wheelCtx.strokeStyle = '#FEF08A';
                wheelCtx.stroke();
                wheelCtx.restore();

                // Outcome Particle Effects Layer
                for (let i = 0; i < wheel.particles.length; i++) {
                    const p = wheel.particles[i];
                    const alpha = Math.max(0, Math.min(1, p.life / (p.maxLife * 0.45)));
                    wheelCtx.save();
                    wheelCtx.globalAlpha = alpha;
                    wheelCtx.translate(p.x, p.y);

                    if (p.type === 'confetti') {
                        wheelCtx.rotate(p.rot);
                        wheelCtx.fillStyle = p.color;
                        wheelCtx.fillRect(-p.size * 0.5, -p.size * 0.3, p.size, p.size * 0.6);
                    } else if (p.type === 'x') {
                        wheelCtx.rotate(p.rot);
                        wheelCtx.strokeStyle = p.color;
                        wheelCtx.lineWidth = 2.6;
                        wheelCtx.lineCap = 'round';
                        const r = p.size * 0.42;
                        wheelCtx.beginPath();
                        wheelCtx.moveTo(-r, -r);
                        wheelCtx.lineTo(r, r);
                        wheelCtx.moveTo(r, -r);
                        wheelCtx.lineTo(-r, r);
                        wheelCtx.stroke();
                    } else if (p.type === 'ghost') {
                        const r = p.size * 0.45;
                        wheelCtx.fillStyle = 'rgba(226, 232, 240, 0.92)';
                        wheelCtx.beginPath();
                        wheelCtx.arc(0, -r * 0.2, r, Math.PI, 0);
                        wheelCtx.lineTo(r, r * 0.9);
                        wheelCtx.lineTo(r * 0.35, r * 0.55);
                        wheelCtx.lineTo(0, r * 0.9);
                        wheelCtx.lineTo(-r * 0.35, r * 0.55);
                        wheelCtx.lineTo(-r, r * 0.9);
                        wheelCtx.closePath();
                        wheelCtx.fill();
                        wheelCtx.fillStyle = '#0F172A';
                        wheelCtx.beginPath();
                        wheelCtx.arc(-r * 0.34, -r * 0.22, r * 0.16, 0, TWO_PI);
                        wheelCtx.arc(r * 0.34, -r * 0.22, r * 0.16, 0, TWO_PI);
                        wheelCtx.fill();
                    } else if (p.type === 'question') {
                        wheelCtx.fillStyle = p.color;
                        wheelCtx.font = `800 ${p.size}px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
                        wheelCtx.textAlign = 'center';
                        wheelCtx.textBaseline = 'middle';
                        wheelCtx.fillText('?', 0, 0);
                    } else if (p.type === 'sparkle') {
                        const r = p.size;
                        wheelCtx.fillStyle = p.color;
                        wheelCtx.beginPath();
                        wheelCtx.moveTo(0, -r);
                        wheelCtx.quadraticCurveTo(0, 0, r, 0);
                        wheelCtx.quadraticCurveTo(0, 0, 0, r);
                        wheelCtx.quadraticCurveTo(0, 0, -r, 0);
                        wheelCtx.quadraticCurveTo(0, 0, 0, -r);
                        wheelCtx.fill();
                    }
                    wheelCtx.restore();
                }
            }

            // 3. Buzzer State (Heavy Spring)
            const buzzer = {
                width: 0,
                height: 0,
                isPressed: false,
                isHovered: false,
                hoverAmount: 0,
                pressPos: 0,
                pressVel: 0
            };

            function resizeBuzzer() {
                const rect = canvas.getBoundingClientRect();
                const dpr = Math.min(window.devicePixelRatio || 1, 3);
                buzzer.width = rect.width;
                buzzer.height = rect.height;
                canvas.width = Math.round(rect.width * dpr);
                canvas.height = Math.round(rect.height * dpr);
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }

            function isPointInsideButton(clientX, clientY) {
                const rect = canvas.getBoundingClientRect();
                const x = clientX - rect.left;
                const y = clientY - rect.top;
                const cx = buzzer.width * 0.5;
                const cy = buzzer.height * 0.49;
                const scale = Math.min(buzzer.width / 280, buzzer.height / 210);
                const rx = 86 * scale;
                const ry = 60 * scale;
                const nx = (x - cx) / rx;
                const ny = (y - cy) / ry;
                return (nx * nx + ny * ny) <= 1.05;
            }

            function pressBuzzer() {
                if (buzzer.isPressed || hired) return;
                buzzer.isPressed = true;
                playPressSound();
                spinWheel();
            }

            function releaseBuzzer() {
                if (!buzzer.isPressed) return;
                buzzer.isPressed = false;
                playReleaseSound();
            }

            // Mouse, Touch & Keyboard Controls
            canvas.addEventListener('mousemove', (e) => {
                const inside = isPointInsideButton(e.clientX, e.clientY);
                buzzer.isHovered = inside && !hired;
                canvas.style.cursor = inside ? 'pointer' : 'default';
            });

            canvas.addEventListener('mouseleave', () => {
                buzzer.isHovered = false;
                canvas.style.cursor = 'default';
                releaseBuzzer();
            });

            canvas.addEventListener('mousedown', (e) => {
                if (e.button !== 0) return;
                if (isPointInsideButton(e.clientX, e.clientY)) {
                    pressBuzzer();
                }
            });

            window.addEventListener('mouseup', releaseBuzzer);

            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const t = e.touches[0];
                if (t && !hired && isPointInsideButton(t.clientX, t.clientY)) {
                    buzzer.isHovered = true;
                    pressBuzzer();
                }
            }, { passive: false });

            window.addEventListener('touchend', () => {
                buzzer.isHovered = false;
                releaseBuzzer();
            });

            window.addEventListener('touchcancel', () => {
                buzzer.isHovered = false;
                releaseBuzzer();
            });

            window.addEventListener('keydown', (e) => {
                if (e.repeat || celebrating) return;
                if (e.code === 'Space' || e.code === 'Enter') {
                    e.preventDefault();
                    pressBuzzer();
                }
            });

            window.addEventListener('keyup', (e) => {
                if (e.code === 'Space' || e.code === 'Enter') {
                    releaseBuzzer();
                }
            });

            function updateBuzzer(dt) {
                const targetHover = buzzer.isHovered ? 1 : 0;
                buzzer.hoverAmount += (targetHover - buzzer.hoverAmount) * Math.min(1, dt * 14);

                const targetPos = buzzer.isPressed ? 1.0 : (buzzer.isHovered ? -0.1 : 0.0);
                const force = -CONFIG.stiffness * (buzzer.pressPos - targetPos) - CONFIG.damping * buzzer.pressVel;
                buzzer.pressVel += force * dt;
                buzzer.pressPos += buzzer.pressVel * dt;

                if (buzzer.pressPos > 1.06) {
                    buzzer.pressPos = 1.06;
                    if (buzzer.pressVel > 0) buzzer.pressVel *= -0.15;
                }
            }

            function drawBuzzer() {
                const w = buzzer.width;
                const h = buzzer.height;
                if (!w || !h) return;

                ctx.clearRect(0, 0, w, h);

                const cx = w * 0.5;
                const cy = h * 0.5;
                const scale = Math.min(w / 280, h / 210);

                ctx.save();
                ctx.translate(cx, cy);
                ctx.scale(scale, scale);

                const dep = Math.max(0, Math.min(1, buzzer.pressPos));

                // ============================================================
                // 1. 2.5D OFF-WHITE DESKTOP HARDWARE HOUSING (MATCHES MONITOR)
                // ============================================================
                const baseTopY = 8;
                const baseThickness = 15;
                const baseBottomY = baseTopY + baseThickness;
                const baseRx = 104;
                const baseRy = 66;

                // Grounded soft shadow on dark felt desk mat
                ctx.save();
                ctx.beginPath();
                ctx.ellipse(0, baseBottomY + 5, baseRx * 1.03, baseRy * 0.99, 0, 0, TWO_PI);
                ctx.fillStyle = 'rgba(2, 6, 23, 0.52)';
                ctx.fill();
                ctx.restore();

                // Extruded lower hardware base wall
                const baseWallGrad = ctx.createLinearGradient(-baseRx, 0, baseRx, 0);
                baseWallGrad.addColorStop(0.0, CONFIG.baseWallDark);
                baseWallGrad.addColorStop(0.28, CONFIG.baseWallLight);
                baseWallGrad.addColorStop(0.72, CONFIG.baseWallLight);
                baseWallGrad.addColorStop(1.0, CONFIG.baseWallDark);

                ctx.beginPath();
                ctx.ellipse(0, baseBottomY, baseRx, baseRy, 0, 0, Math.PI);
                ctx.lineTo(-baseRx, baseTopY);
                ctx.ellipse(0, baseTopY, baseRx, baseRy, 0, Math.PI, 0, true);
                ctx.closePath();
                ctx.fillStyle = baseWallGrad;
                ctx.fill();
                ctx.lineWidth = 2.4;
                ctx.strokeStyle = CONFIG.baseStroke;
                ctx.stroke();

                // Front status LED on the extruded bezel (green at rest, coral when active)
                const ledActive = buzzer.isPressed || wheel.isSpinning;
                ctx.save();
                ctx.beginPath();
                ctx.ellipse(0, baseTopY + baseRy + baseThickness * 0.48, 5.5, 3, 0, 0, TWO_PI);
                ctx.fillStyle = ledActive ? '#FF4D6D' : '#10B981';
                ctx.shadowColor = ledActive ? 'rgba(255, 77, 109, 0.9)' : 'rgba(16, 185, 129, 0.85)';
                ctx.shadowBlur = 7;
                ctx.fill();
                ctx.lineWidth = 1.1;
                ctx.strokeStyle = ledActive ? '#82222B' : '#065F46';
                ctx.stroke();
                ctx.restore();

                // Top deck of the hardware housing
                const baseTopGrad = ctx.createLinearGradient(0, baseTopY - baseRy, 0, baseTopY + baseRy);
                baseTopGrad.addColorStop(0, CONFIG.baseTopLight);
                baseTopGrad.addColorStop(1, CONFIG.baseTopDark);

                ctx.beginPath();
                ctx.ellipse(0, baseTopY, baseRx, baseRy, 0, 0, TWO_PI);
                ctx.fillStyle = baseTopGrad;
                ctx.fill();
                ctx.lineWidth = 2.4;
                ctx.strokeStyle = CONFIG.baseStroke;
                ctx.stroke();

                // Subtle top specular highlight rim
                ctx.beginPath();
                ctx.ellipse(0, baseTopY + 1.5, baseRx - 3, baseRy - 3, 0, Math.PI * 1.12, Math.PI * 1.88);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
                ctx.lineWidth = 2;
                ctx.lineCap = 'round';
                ctx.stroke();

                // Four subtle corner mounting screws
                const screws = [
                    [-72, baseTopY - 38],
                    [72, baseTopY - 38],
                    [-76, baseTopY + 34],
                    [76, baseTopY + 34]
                ];
                screws.forEach(([sx, sy]) => {
                    ctx.beginPath();
                    ctx.ellipse(sx, sy, 3.6, 2.4, 0, 0, TWO_PI);
                    ctx.fillStyle = '#94A3B8';
                    ctx.fill();
                    ctx.lineWidth = 1;
                    ctx.strokeStyle = '#475569';
                    ctx.stroke();
                });

                // ============================================================
                // 2. RECESSED DARK PLUNGER SOCKET WELL
                // ============================================================
                const wellRx = 78;
                const wellRy = 49;
                const wellY = baseTopY - 1;

                const wellGrad = ctx.createLinearGradient(0, wellY - wellRy, 0, wellY + wellRy);
                wellGrad.addColorStop(0, CONFIG.wellTop);
                wellGrad.addColorStop(1, CONFIG.wellBottom);

                ctx.beginPath();
                ctx.ellipse(0, wellY, wellRx, wellRy, 0, 0, TWO_PI);
                ctx.fillStyle = wellGrad;
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = CONFIG.baseStroke;
                ctx.stroke();

                // ============================================================
                // 3. EXTRUDED 3D PLUNGER (HEAVY SPRING)
                // ============================================================
                const plungerBaseY = wellY + 1;
                const maxExtrusion = 21;
                const minExtrusion = 4.5;
                const currentExtrusion = Math.max(
                    3.2,
                    maxExtrusion - buzzer.pressPos * (maxExtrusion - minExtrusion)
                );
                const topY = plungerBaseY - currentExtrusion;
                const rx = 71;
                const ry = 44.5;

                // Plunger contact shadow inside socket
                ctx.save();
                ctx.shadowColor = `rgba(2, 6, 23, ${(0.35 + dep * 0.25).toFixed(3)})`;
                ctx.shadowBlur = 10 - dep * 6;
                ctx.shadowOffsetY = 3 - dep * 2;
                ctx.beginPath();
                ctx.ellipse(0, plungerBaseY, rx, ry, 0, 0, TWO_PI);
                ctx.fillStyle = CONFIG.wallDark;
                ctx.fill();
                ctx.restore();

                // Extruded 3D coral cylinder wall
                const wallGrad = ctx.createLinearGradient(-rx, 0, rx, 0);
                wallGrad.addColorStop(0.0, CONFIG.wallDark);
                wallGrad.addColorStop(0.24, CONFIG.wallColor);
                wallGrad.addColorStop(0.76, CONFIG.wallColor);
                wallGrad.addColorStop(1.0, CONFIG.wallDark);

                ctx.beginPath();
                ctx.ellipse(0, plungerBaseY, rx, ry, 0, 0, Math.PI);
                ctx.lineTo(-rx, topY);
                ctx.ellipse(0, topY, rx, ry, 0, Math.PI, 0, true);
                ctx.closePath();
                ctx.fillStyle = wallGrad;
                ctx.fill();
                ctx.lineWidth = 1.6;
                ctx.strokeStyle = CONFIG.rimStroke;
                ctx.stroke();

                // Coral Top Cap Surface
                const lightShiftY = dep * 5;
                const topGrad = ctx.createRadialGradient(0, topY - 12 + lightShiftY, 8, 0, topY, rx * 1.1);
                topGrad.addColorStop(0, CONFIG.topCenter);
                topGrad.addColorStop(1, CONFIG.topEdge);

                ctx.beginPath();
                ctx.ellipse(0, topY, rx, ry, 0, 0, TWO_PI);
                ctx.fillStyle = topGrad;
                ctx.fill();

                if (dep > 0.01) {
                    ctx.fillStyle = `rgba(17, 24, 39, ${(dep * 0.055).toFixed(3)})`;
                    ctx.fill();
                } else if (buzzer.hoverAmount > 0.01) {
                    ctx.fillStyle = `rgba(255, 255, 255, ${(buzzer.hoverAmount * 0.08).toFixed(3)})`;
                    ctx.fill();
                }

                // Soft top crescent sheen clipped inside cap
                ctx.save();
                ctx.clip();
                ctx.beginPath();
                ctx.ellipse(0, topY + 2, rx - 2.5, ry - 2.5, 0, Math.PI * 1.12, Math.PI * 1.88);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.34)';
                ctx.lineWidth = 2.4;
                ctx.lineCap = 'round';
                ctx.stroke();
                ctx.restore();

                // Crisp rim stroke
                ctx.beginPath();
                ctx.ellipse(0, topY, rx, ry, 0, 0, TWO_PI);
                ctx.lineWidth = 1.7;
                ctx.strokeStyle = CONFIG.rimStroke;
                ctx.stroke();

                // Silkscreened 2.5D Perspective "GET A JOB" Typography
                ctx.save();
                ctx.translate(0, topY + 1);
                ctx.scale(1, 0.72); // Match elliptical desk perspective
                ctx.font = '800 18px "Bricolage Grotesque", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                // Subtle engraved drop shadow
                ctx.fillStyle = 'rgba(130, 34, 43, 0.48)';
                ctx.fillText('GET A JOB', 0, 2);

                ctx.fillStyle = dep > 0.5 ? '#FFE4E6' : '#FFFFFF';
                ctx.fillText('GET A JOB', 0, 0);
                ctx.restore();

                ctx.restore();
            }

            // 3B. Job-Offer State, Celebration & Share
            // Landing the 0.7% offer retires the buzzer. The state is kept per browser.
            const HIRED_KEY = 'coralPuckHired';
            const SHARE_URL = 'https://getjob.pages.dev/';
            const buzzerWrapperEl = document.getElementById('buzzer-wrapper');
            const celebrateEl = document.getElementById('celebrate');
            const celebrateCanvas = document.getElementById('celebrate-canvas');
            const celebrateCtx = celebrateCanvas.getContext('2d');
            const celebrateAppsEl = document.getElementById('celebrate-apps');
            const celebrateNounEl = document.getElementById('celebrate-noun');
            const celebrateCloseEl = document.getElementById('celebrate-close');
            const shareToastEl = document.getElementById('share-toast');
            const hiredShareEl = document.getElementById('hired-share');
            const hiredShareBtn = document.getElementById('hired-share-btn');
            const reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
            const CELEBRATE_COLORS = ['#FF2A54', '#FF4D6D', '#FEF08A', '#34D399', '#60A5FA', '#C084FC', '#FDBA74', '#FFFFFF'];

            let hired = false;
            let celebrating = false;
            let celebrateRaf = 0;
            let celebrateStart = 0;
            let celebrateLast = 0;
            let celebrateBursts = [];
            let celebrateRain = false;
            let celebrateParticles = [];
            let celebrateApps = 0;
            let celebrateW = 0;
            let celebrateH = 0;
            let toastTimer = 0;

            function readHired() {
                try {
                    const raw = localStorage.getItem(HIRED_KEY);
                    return raw ? JSON.parse(raw) : null;
                } catch (e) {
                    return null;
                }
            }

            function writeHired(apps) {
                try {
                    localStorage.setItem(HIRED_KEY, JSON.stringify({ apps }));
                } catch (e) {}
            }

            function applyHiredState(apps) {
                hired = true;
                buzzer.isHovered = false;
                buzzerWrapperEl.classList.add('is-hired');
                canvas.setAttribute('aria-disabled', 'true');
                canvas.setAttribute('tabindex', '-1');
                canvas.setAttribute('aria-label', 'Get a Job, button retired after landing a job');
                wheelStatusEl.textContent = '★ Job secured. Button retired ★';
                wheelStatusEl.classList.add('is-win');
                appsCounterEl.innerHTML = `Apps: <strong>${apps}</strong>`;
                hiredShareEl.hidden = false;
            }

            function onWin() {
                const apps = wheel.apps;
                writeHired(apps);
                applyHiredState(apps);
                // Let the wheel-landing moment register before the party starts
                setTimeout(() => openCelebration(apps, true), 900);
            }

            function sizeCelebrateCanvas() {
                const rect = celebrateCanvas.getBoundingClientRect();
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                celebrateW = rect.width;
                celebrateH = rect.height;
                celebrateCanvas.width = Math.round(rect.width * dpr);
                celebrateCanvas.height = Math.round(rect.height * dpr);
                celebrateCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }

            function spawnConfettiPiece(x, y, vx, vy) {
                return {
                    x,
                    y,
                    vx,
                    vy,
                    rot: Math.random() * TWO_PI,
                    vr: (Math.random() - 0.5) * 12,
                    wobble: Math.random() * TWO_PI,
                    w: 6 + Math.random() * 6,
                    h: 9 + Math.random() * 7,
                    color: CELEBRATE_COLORS[Math.floor(Math.random() * CELEBRATE_COLORS.length)],
                    shape: Math.random() < 0.25 ? 'circle' : 'rect',
                    life: 2.6 + Math.random() * 1.6
                };
            }

            function burstAt(xFrac, yFrac, count) {
                const x = celebrateW * xFrac;
                const y = celebrateH * yFrac;
                for (let i = 0; i < count; i++) {
                    const a = Math.random() * TWO_PI;
                    const spd = 160 + Math.random() * 340;
                    celebrateParticles.push(spawnConfettiPiece(x, y, Math.cos(a) * spd, Math.sin(a) * spd - 120));
                }
            }

            function celebrateLoop(now) {
                if (!celebrating) return;
                const t = (now - celebrateStart) / 1000;
                const dt = Math.min(0.033, Math.max(0, (now - celebrateLast) / 1000));
                celebrateLast = now;

                while (celebrateBursts.length && t >= celebrateBursts[0]) {
                    celebrateBursts.shift();
                    burstAt(0.15 + Math.random() * 0.7, 0.2 + Math.random() * 0.25, reduceMotion ? 24 : 70);
                }

                if (celebrateRain && t < 4.5) {
                    for (let i = 0; i < 3; i++) {
                        celebrateParticles.push(spawnConfettiPiece(Math.random() * celebrateW, -12, (Math.random() - 0.5) * 60, 60 + Math.random() * 120));
                    }
                } else {
                    celebrateRain = false;
                }

                celebrateCtx.clearRect(0, 0, celebrateW, celebrateH);
                for (let i = celebrateParticles.length - 1; i >= 0; i--) {
                    const p = celebrateParticles[i];
                    p.life -= dt;
                    if (p.life <= 0 || p.y > celebrateH + 30) {
                        celebrateParticles.splice(i, 1);
                        continue;
                    }
                    p.vx *= Math.max(0, 1 - 1.2 * dt);
                    p.vy = Math.min(p.vy + 620 * dt, 260);
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.rot += p.vr * dt;
                    p.wobble += dt * 6;

                    celebrateCtx.save();
                    celebrateCtx.globalAlpha = Math.min(1, p.life);
                    celebrateCtx.translate(p.x, p.y);
                    celebrateCtx.rotate(p.rot);
                    celebrateCtx.scale(Math.cos(p.wobble), 1);
                    celebrateCtx.fillStyle = p.color;
                    if (p.shape === 'circle') {
                        celebrateCtx.beginPath();
                        celebrateCtx.arc(0, 0, p.w * 0.45, 0, TWO_PI);
                        celebrateCtx.fill();
                    } else {
                        celebrateCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                    }
                    celebrateCtx.restore();
                }

                if (celebrateParticles.length || celebrateBursts.length || celebrateRain) {
                    celebrateRaf = requestAnimationFrame(celebrateLoop);
                } else {
                    celebrateRaf = 0;
                }
            }

            function openCelebration(apps, fireworks) {
                celebrateApps = apps;
                celebrateAppsEl.textContent = apps;
                celebrateNounEl.textContent = apps === 1 ? 'application' : 'applications';
                celebrateEl.hidden = false;
                sizeCelebrateCanvas();
                celebrating = true;
                celebrateParticles = [];
                celebrateStart = performance.now();
                celebrateLast = celebrateStart;
                celebrateBursts = fireworks ? (reduceMotion ? [0.1] : [0.05, 0.45, 0.9, 1.5, 2.2]) : [];
                celebrateRain = fireworks && !reduceMotion;
                shareToastEl.textContent = '';
                requestAnimationFrame(() => requestAnimationFrame(() => celebrateEl.classList.add('is-open')));
                cancelAnimationFrame(celebrateRaf);
                celebrateRaf = requestAnimationFrame(celebrateLoop);
                if (navigator.vibrate) navigator.vibrate([60, 40, 120]);
                setTimeout(() => celebrateCloseEl.focus({ preventScroll: true }), 60);
            }

            function closeCelebration() {
                if (!celebrating) return;
                celebrating = false;
                celebrateEl.classList.remove('is-open');
                cancelAnimationFrame(celebrateRaf);
                celebrateRaf = 0;
                celebrateParticles = [];
                celebrateBursts = [];
                celebrateRain = false;
                celebrateCtx.clearRect(0, 0, celebrateW, celebrateH);
                setTimeout(() => {
                    if (!celebrating) celebrateEl.hidden = true;
                }, 320);
            }

            function showToast(msg) {
                shareToastEl.textContent = msg;
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => { shareToastEl.textContent = ''; }, 2800);
            }

            function legacyCopy(text) {
                try {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    ta.setAttribute('readonly', '');
                    ta.style.position = 'fixed';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.select();
                    ta.setSelectionRange(0, 999);
                    const ok = document.execCommand('copy');
                    document.body.removeChild(ta);
                    return ok;
                } catch (e) {
                    return false;
                }
            }

            function copyText(text) {
                if (navigator.clipboard && window.isSecureContext) {
                    return navigator.clipboard.writeText(text).then(() => true, () => legacyCopy(text));
                }
                return Promise.resolve(legacyCopy(text));
            }

            function openShare(url) {
                // Synthetic anchor click: keeps this page open and avoids popup blockers
                const a = document.createElement('a');
                a.href = url;
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
                document.body.appendChild(a);
                a.click();
                a.remove();
            }

            function shareMessage(apps) {
                return `I got the job after ${apps} application${apps === 1 ? '' : 's'} 🎉 Beat the 0.7% odds.`;
            }

            function handleShare(kind) {
                const apps = celebrateApps || wheel.apps;
                const text = shareMessage(apps);
                const full = `${text} ${SHARE_URL}`;
                const enc = encodeURIComponent;

                if (kind === 'native') {
                    if (navigator.share) {
                        navigator.share({ title: 'Find a Job in 2026', text, url: SHARE_URL }).catch(() => {});
                        return;
                    }
                    copyText(full).then((ok) => showToast(ok ? 'Link copied. Paste it anywhere.' : 'Could not copy. Try the Copy link button.'));
                    return;
                }
                if (kind === 'whatsapp') {
                    openShare(`https://wa.me/?text=${enc(full)}`);
                    return;
                }
                if (kind === 'x') {
                    openShare(`https://twitter.com/intent/tweet?text=${enc(text)}&url=${enc(SHARE_URL)}`);
                    return;
                }
                if (kind === 'linkedin') {
                    // LinkedIn only accepts a URL and builds the card from the page's og: tags
                    copyText(full).then((ok) => showToast(ok ? 'Post text copied. Paste it into your LinkedIn post.' : 'Opening LinkedIn.'));
                    openShare(`https://www.linkedin.com/sharing/share-offsite/?url=${enc(SHARE_URL)}`);
                    return;
                }
                if (kind === 'copy') {
                    copyText(full).then((ok) => showToast(ok ? 'Copied! Paste it anywhere.' : 'Could not copy. Try again.'));
                }
            }

            celebrateEl.querySelectorAll('[data-share]').forEach((btn) => {
                btn.addEventListener('click', () => handleShare(btn.dataset.share));
            });
            celebrateCloseEl.addEventListener('click', closeCelebration);
            celebrateEl.addEventListener('click', (e) => {
                if (e.target === celebrateEl) closeCelebration();
            });
            window.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeCelebration();
            });
            hiredShareBtn.addEventListener('click', () => openCelebration(wheel.apps, false));

            // 4. Bootstrap & Unified Animation Loop
            function handleResize() {
                resizeWheel();
                resizeBuzzer();
                sizeCelebrateCanvas();
            }

            // Add ?reset to the URL to clear the job-offer state (handy for testing)
            if (new URLSearchParams(location.search).has('reset')) {
                try { localStorage.removeItem(HIRED_KEY); } catch (e) {}
            }
            const savedHire = readHired();
            if (savedHire) {
                wheel.apps = Number(savedHire.apps) || 0;
                applyHiredState(wheel.apps);
            }

            handleResize();
            window.addEventListener('resize', handleResize);

            let lastTime = performance.now();
            function loop(now) {
                const dt = Math.min((now - lastTime) / 1000, 0.032);
                lastTime = now;

                updateWheel(dt);
                drawWheel();
                updateBuzzer(dt);
                drawBuzzer();

                requestAnimationFrame(loop);
            }

            requestAnimationFrame(loop);
        })();
    </script>
</body>
</html>
